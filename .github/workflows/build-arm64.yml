name: build-arm64

on:
  workflow_dispatch:
    inputs:
      pgo_phase:
        description: "Profile-guided optimization phase"
        type: choice
        options: [none, generate, use]
        default: none
  push:
    branches:
      - prototype/rg40xx

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:22.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates git cmake ninja-build build-essential python3 \
            zip file binutils pkg-config

      - uses: actions/checkout@v4

      - name: Build
        env:
          # Leave unset for ordinary push builds so build-arm64.sh
          # auto-detects (uses the committed PGO profile if present).
          # workflow_dispatch always passes an explicit choice (its own
          # default is "none"), for generate/use profiling runs or to
          # deliberately opt out.
          STARFOX_PGO_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.pgo_phase || '' }}
        run: ./scripts/build-arm64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sternenfuchs-aarch64
          path: dist/sternenfuchs.zip
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: sternenfuchs-aarch64-pr-layout
          path: dist/sternenfuchs-pr.zip
          retention-days: 7
