name: build-arm64

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/rg40xx

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:22.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates git cmake ninja-build build-essential python3 \
            zip file binutils pkg-config

      - uses: actions/checkout@v4

      - name: Build
        run: ./scripts/build-arm64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sternenfuchs-aarch64
          path: dist/sternenfuchs.zip
          retention-days: 7
