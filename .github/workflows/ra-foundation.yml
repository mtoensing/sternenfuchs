name: ra-foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ra/**"
      - "tests/ra_*"
      - "scripts/build-rcheevos-arm64.sh"
      - "scripts/versions.sh"
      - ".github/workflows/ra-foundation.yml"

jobs:
  arm64-foundation:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:22.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y             ca-certificates git build-essential file python3

      - uses: actions/checkout@v4

      - name: Verify Sternenfuchs patches against pinned upstream
        run: |
          . scripts/versions.sh
          rm -rf /tmp/starfox-ra-patch-check
          GIT_LFS_SKIP_SMUDGE=1 git clone "$STARFOX_REPO" /tmp/starfox-ra-patch-check
          git -C /tmp/starfox-ra-patch-check checkout "$STARFOX_COMMIT"
          for patch in patches/*.patch; do
            git -C /tmp/starfox-ra-patch-check apply "$GITHUB_WORKSPACE/$patch"
          done
          python3 scripts/apply-ra-menu.py /tmp/starfox-ra-patch-check

      - name: Build pinned rcheevos
        run: bash scripts/build-rcheevos-arm64.sh

      - name: Test read-only SNES WRAM adapter
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -I.             tests/ra_memory_adapter_test.cpp             -o /tmp/ra_memory_adapter_test
          /tmp/ra_memory_adapter_test


  arm64-menu-build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:22.04

    steps:
      - name: Install full build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates git curl cmake ninja-build build-essential python3 \
            zip file binutils pkg-config

      - uses: actions/checkout@v4

      - name: Build transformed Sternenfuchs runtime
        env:
          STARFOX_PGO_PHASE: none
        run: ./scripts/build-arm64.sh

      - name: Verify ARM64 runtime artifact
        run: |
          test -x dist/sternenfuchs/starfox.aarch64
          file dist/sternenfuchs/starfox.aarch64
