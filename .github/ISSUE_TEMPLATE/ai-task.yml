name: AI implementation task
description: A self-contained implementation task intended for an AI coding agent.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for implementation work that should be solvable by a fresh AI agent without relying on chat history.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the user-visible or technical outcome.
      placeholder: What must be true when this task is complete?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Technical context
      description: Relevant architecture, files, upstreams, APIs, and known facts. Include enough context that the agent does not need to restart broad research.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Concrete work to perform, in priority order.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints / non-goals
      description: Things the agent must not change or prematurely implement.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Objective checks that prove the task is done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation evidence
      description: Commands, logs, device tests, screenshots, hashes, or other evidence the agent must collect.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Relevant source files and external documentation.
